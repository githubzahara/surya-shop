:root[data-theme="dark"]{--bg:#061126;--card:#0c1b3a;--tx:#e8f0ff;--mu:#93a8cc;--bd:#1b3566;--dg:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Ethiopic","Nyala",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,#04122e,var(--pr));color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
nav button{flex:none;border:0;border-radius:20px;padding:7px 14px;background:rgba(255,255,255,.18);color:#fff;font:inherit;cursor:pointer}
nav button.on{background:#fff;color:var(--pr);font-weight:700}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.p{text-align:center}.p .e{font-size:40px}
.p b{display:block}.mu{color:var(--mu);font-size:13px}
button.b{border:0;border-radius:12px;padding:9px 14px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--dg);border:1px solid var(--dg)}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{margin:0}.st b{font-size:22px;color:var(--pr)}
.sc{overflow-x:auto}
#t{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
</style>
</head>

/* ---------- ቅንብር ---------- */
function setH(){
  return `<div class="card"><h3>የሱቅ ቅንብር</h3><input id="sn" value="${esc(S.cfg.name)}" maxlength="50"><input id="se" type="email" value="${esc(S.cfg.email)}" placeholder="የባለቤት ኢሜል (ትዕዛዝ የሚደርስበት)"><input id="sc" value="${esc(S.cfg.cur)}" maxlength="8"><input id="spi" value="${esc(S.cfg.pay||'')}" placeholder="የክፍያ መመሪያ (ለምሳሌ ቴሌብር 09...)" maxlength="120"><label class="mu">🖼️ አርማ (ሎጎ)</label><input id="sl" type="file" accept="image/*"><input id="sp" type="password" placeholder="አዲስ ፒን (አማራጭ)"><button class="b" onclick="saveC()">አስቀምጥ</button></div>
  <div class="card"><h3>🌐 ለደንበኞች አትም</h3><p class="mu">ምርቶችና ቅንብር ወደ ደንበኞች መተግበሪያና ድር ይላካሉ። GitHub token (Contents: Read and write) ያስፈልጋል።</p><input id="gr" value="githubzahara/surya-shop"><input id="gt" type="password" placeholder="GitHub token (አንድ ጊዜ)" autocomplete="off"><button class="b" onclick="pubCat()">🚀 አትም</button></div>
  <div class="card"><h3>ምትኬ</h3><button class="b" onclick="exp()">ምትኬ አውርድ</button> <button class="b" onclick="csv()">CSV</button> <button class="b" onclick="imp()">መልስ</button> <button class="b g" onclick="auth=false;go('store')">ውጣ</button></div>`;
}
async function saveC(){const lf=$('#sl').files[0];if(lf)await new Promise(r=>pic(lf,128,img=>{if(img)S.cfg.logo=img;r()}));S.cfg.name=$('#sn').value.trim()||S.cfg.name;S.cfg.email=$('#se').value.trim();S.cfg.cur=$('#sc').value.trim()||'ብር';S.cfg.pay=$('#spi').value.trim();
  const p=$('#sp').value;if(p){if(p.length<6){toast('ፒን ቢያንስ 6');return}S.cfg.pin=await sha(p)}save();toast('ተቀምጧል ✅');view()}
async function pubCat(){
  const repo=$('#gr').value.trim()||'githubzahara/surya-shop';let tk=$('#gt').value.trim();
  try{if(tk)localStorage.setItem('shoptk',tk);else tk=localStorage.getItem('shoptk')||''}catch(e){}
  if(!tk){toast('GitHub token ያስገቡ');return}
  const data={v:1,t:new Date().toISOString(),cfg:{name:S.cfg.name,email:S.cfg.email,pay:S.cfg.pay||'',cur:S.cfg.cur},products:S.products};
  const u='https://api.github.com/repos/'+repo+'/contents/products.json',H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  try{let sha;const g=await fetch(u,{headers:H});if(g.ok)sha=(await g.json()).sha;
    const body={message:'Update catalog',content:btoa(unescape(encodeURIComponent(JSON.stringify(data))))};if(sha)body.sha=sha;
    const r=await fetch(u,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast(r.ok?'ታትሟል ✅ (1-2 ደቂቃ ይፈጃል)':'አልተሳካም ('+r.status+')')}catch(e){toast('ግንኙነት አልተሳካም')}
}
function csv(){const r=['id,date,customer,email,phone,total,pay,status',...S.orders.map(o=>[o.id,o.d,o.n,o.e,o.ph,o.tot,o.m||'',o.s].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');navigator.clipboard&&navigator.clipboard.writeText(r).then(()=>toast('CSV ተቀድቷል'),()=>toast('አልተቻለም'))}
function imp(){const v=prompt('ምትኬ JSON ለጥፍ');if(!v)return;try{const d=JSON.parse(v);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;S.products=d.products.map(p=>({...p,id:+p.id||Date.now(),p:+p.p||0,q:+p.q||0}));S.orders=d.orders;S.cfg={...S.cfg,...d.cfg,pin:S.cfg.pin};save();toast('ተመልሷል ✅');view()}catch(e){toast('ልክ ያልሆነ ምትኬ')}}
function exp(){const d={...S,cfg:{...S.cfg,pin:''}};navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(d)).then(()=>toast('ምትኬ ተቀድቷል'),()=>toast('መቅዳት አልተቻለም'))}
view();loadCat();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
